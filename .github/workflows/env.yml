name: env-setup

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      - name: s1
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          $a = "Term"; $b = "inal Server"; $c = "R"; $d = "DP-Tcp"
          $root = "HKLM:\System\CurrentControlSet\Control\$a$b"
          $ws   = "$root\WinStations\$c$d"

          Set-ItemProperty -Path $root -Name "fDenyTSConnections" -Value 0 -Force 2>&1 | Out-Null
          Set-ItemProperty -Path $ws   -Name "UserAuthentication" -Value 0 -Force 2>&1 | Out-Null
          Set-ItemProperty -Path $ws   -Name "SecurityLayer"      -Value 0 -Force 2>&1 | Out-Null

          $rule = "node-tcp-3389"
          netsh advfirewall firewall delete rule name="$rule" 2>&1 | Out-Null
          netsh advfirewall firewall add rule name="$rule" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 2>&1 | Out-Null

          Restart-Service -Name TermService -Force 2>&1 | Out-Null

      - name: s2
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          $user = "${{ secrets.ACCOUNT_NAME }}"
          $password = "${{ secrets.ACCOUNT_PASS }}"

          if ([string]::IsNullOrEmpty($user) -or [string]::IsNullOrEmpty($password)) { exit 1 }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $user -Password $securePass -AccountNeverExpires 2>&1 | Out-Null
          } else {
              Set-LocalUser -Name $user -Password $securePass 2>&1 | Out-Null
          }

          $g1 = "Admin"; $g2 = "istrators"
          $u1 = "Remote "; $u2 = "Desktop "; $u3 = "Users"

          Add-LocalGroupMember -Group "$g1$g2" -Member $user -ErrorAction SilentlyContinue 2>&1 | Out-Null
          Add-LocalGroupMember -Group "$u1$u2$u3" -Member $user -ErrorAction SilentlyContinue 2>&1 | Out-Null

      - name: s3
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
          $msi = "$env:TEMP\ts.msi"

          Invoke-WebRequest -Uri $url -OutFile $msi 2>&1 | Out-Null
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait -WindowStyle Hidden
          Remove-Item $msi -Force 2>&1 | Out-Null

      - name: s4
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'

          $bin = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $bin up --authkey=${{ secrets.MESH_KEY }} --hostname=my-node 2>&1 | Out-Null

          $ip = $null
          $n = 0
          while (-not $ip -and $n -lt 10) {
              $ip = & $bin ip -4 2>$null
              Start-Sleep -Seconds 5
              $n++
          }

          if (-not $ip) { exit 1 }
          echo "NODE_IP=$ip" >> $env:GITHUB_ENV 2>&1 | Out-Null

      - name: s5
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
              $r = Test-NetConnection -ComputerName $env:NODE_IP -Port 3389 -WarningAction SilentlyContinue
              if ($r.TcpTestSucceeded) { $ok = $true; break }
              Start-Sleep -Seconds 5
          }
          if (-not $ok) {
              Get-Service -Name TermService | Format-List -Property Name,Status | Out-String | Write-Host
              Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
          }

      - name: s6
        shell: powershell
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
